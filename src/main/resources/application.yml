server:
  port: ${PORT:8080}
  
spring:
  application:
    name: sentinelpay
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:sentinelpay.db}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.sqlite.JDBC}
    
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
  
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    root: INFO
    com.github.sentinel.pay: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
