<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}" lang="EN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container my-4">
        <!-- Header -->
        <div class="card mb-4">
            <div class="card-body">
                <h1 class="h2 mb-1">Profile Settings</h1>
                <p class="text-muted mb-0">Update your personal information and profile details</p>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/settings/profile}" th:object="${user}" method="post">
                            <!-- Avatar Section -->
                            <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                                <div class="avatar me-3" th:text="${user.name.substring(0,1)}">U</div>
                                <div>
                                    <h6 class="mb-1">Profile Photo</h6>
                                    <button type="button" class="btn btn-outline-secondary btn-sm">Change Photo</button>
                                </div>
                            </div>

                            <!-- Personal Information -->
                            <h5 class="mb-3">Personal Information</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="John" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="john.doe@example.com" required>
                                </div>
                            </div>

                            <!-- Security Section -->
                            <h5 class="mb-3 mt-4">Security</h5>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="••••••••">
                                <small class="text-muted">Leave blank to keep current password</small>
                            </div>

                            <!-- Action Buttons -->
                            <div class="mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-primary me-2">Save Changes</button>
                                <button type="reset" class="btn btn-outline-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
