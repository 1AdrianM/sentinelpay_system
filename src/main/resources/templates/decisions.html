<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Sentinel Pay - Decisions</title>
</head>
<body>

<div layout:fragment="content" class="p-4">

    <div class="dashboard-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1>Decision Engine</h1>
                <p class="dashboard-subtitle">Review, filter, and audit transaction resolutions</p>
            </div>
            <button class="btn-secondary" sec:authorize="hasRole('ROLE_ADMIN')">
                <i class="bi bi-download me-2"></i>Export History
            </button>
        </div>
    </div>

    <div class="content-card mb-4">
        <div class="content-card-header">
            <h5 class="content-card-title mb-0">
                <i class="bi bi-filter-left"></i> Filter Decisions
            </h5>
        </div>
        <div class="card-body p-4">
            <form class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="statusFilter" class="form-label fw-bold small text-muted">STATUS</label>
                    <select id="statusFilter" class="form-select border-0 bg-light" th:disabled="${isReadOnly}">
                        <option selected>All Statuses</option>
                        <option>PENDING</option>
                        <option>APPROVED</option>
                        <option>REJECTED</option>
                        <option>ESCALATED</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="riskLevelFilter" class="form-label fw-bold small text-muted">RISK LEVEL</label>
                    <select id="riskLevelFilter" class="form-select border-0 bg-light" th:disabled="${isReadOnly}">
                        <option selected>All Levels</option>
                        <option>LOW</option>
                        <option>MEDIUM</option>
                        <option>HIGH</option>
                        <option>CRITICAL</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="actorFilter" class="form-label fw-bold small text-muted">ACTOR</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                        <input type="text" id="actorFilter" class="form-control border-0 bg-light"
                               placeholder="Filter by actor..." th:attr="readonly=${isReadOnly}">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn-action w-100" th:disabled="${isReadOnly}"
                            sec:authorize="!hasRole('ROLE_READ_ONLY')">
                        Apply Filters
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="content-card">
        <div class="content-card-header">
            <h2 class="content-card-title">
                <i class="bi bi-list-check"></i> All Decisions
            </h2>
        </div>
        <div class="table-responsive">
            <table class="modern-table w-100">
                <thead>
                <tr>
                    <th>Decision ID</th>
                    <th>Status</th>
                    <th>Risk Level</th>
                    <th>Actor</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="decision : ${decisions}">
                    <td><span class="id-display" th:text="${decision.decisionId}">#DEC-001</span></td>
                    <td>
                            <span th:text="${decision.status}"
                                  th:classappend="${decision.status == 'PENDING' ? 'badge-status-open' :
                                                 (decision.status == 'APPROVED' ? 'badge-status-resolved' :
                                                 (decision.status == 'REJECTED' ? 'badge-risk-high' : 'badge-status-investigating'))}"
                                  class="badge-modern"></span>
                    </td>
                    <td>
                            <span th:text="${decision.riskLevel}"
                                  th:classappend="${decision.riskLevel == 'CRITICAL' || decision.riskLevel == 'HIGH' ? 'badge-risk-high' :
                                                 (decision.riskLevel == 'MEDIUM' ? 'badge-risk-medium' : 'badge-risk-low'))}"
                                  class="badge-modern"></span>
                    </td>
                    <td class="fw-medium text-dark" th:text="${decision.actor}">System Admin</td>
                    <td class="text-muted small" th:text="${#temporals.format(decision.createdAt, 'dd/MM/yyyy HH:mm')}">25/02/2026 17:30</td>
                    <td>
                        <a th:href="@{/decisions/{id}(id=${decision.decisionId})}" class="btn-link text-decoration-none">
                            <i class="bi bi-eye me-1"></i>Details
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(decisions)}">
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="bi bi-shield-slash"></i>
                            <p>No decisions found matching the filters.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
