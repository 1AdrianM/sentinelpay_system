<div th:fragment="response-card" class="h-100 animate__animated animate__fadeIn">
    <style>
        .result-header {
            background: var(--sidebar-bg); /* Negro profundo */
            border-radius: 12px;
            padding: 1.25rem;
            color: white;
            margin-bottom: 1.5rem;
            border: 1px solid #2d333b;
        }

        .score-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid currentColor;
            line-height: 1;
        }

        .rule-tag {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.7rem;
            padding: 4px 8px;
            background: var(--main-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--accent-green);
            display: inline-block;
            margin: 2px;
        }

        .accordion-sentinel {
            --bs-accordion-border-color: var(--border-color);
            --bs-accordion-btn-icon-width: 0.8rem;
        }

        .accordion-sentinel .accordion-button {
            font-size: 0.875rem;
            font-weight: 600;
            padding: 1rem;
        }

        .accordion-sentinel .accordion-button:not(.collapsed) {
            background-color: var(--accent-green-soft);
            color: var(--text-main);
            box-shadow: none;
        }

        .analysis-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }
    </style>

    <div th:if="${success}">
        <div class="result-header d-flex justify-content-between align-items-center">
            <div>
                <div class="analysis-label" style="color: #94a3b8;">Final Decision</div>
                <h3 class="fw-bold mb-0"
                    th:text="${response.fraudDecision}"
                    th:classappend="${response.fraudDecision == 'APPROVED' ? 'text-success' : (response.fraudDecision == 'REVIEW' ? 'text-warning' : 'text-danger')}">
                    APPROVED
                </h3>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end">
                    <div class="analysis-label" style="color: #94a3b8;">Risk Score</div>
                    <div class="fw-bold" style="font-size: 1.2rem;" th:text="${response.globalRiskScore + '/100'}">0/100</div>
                </div>
                <div class="score-circle"
                     th:classappend="${response.globalRiskScore >= 80 ? 'text-danger' : (response.globalRiskScore >= 50 ? 'text-warning' : 'text-success')}">
                    <span class="fw-800" th:text="${response.globalRiskScore}">0</span>
                </div>
            </div>
        </div>

        <div th:if="${response.incidentId != null}" class="badge-modern badge-risk-high w-100 mb-4 p-3 justify-content-between">
            <span><i class="bi bi-exclamation-triangle-fill me-2"></i> Escalated to Incident Management</span>
            <a th:href="@{/incidents/{id}(id=${response.incidentId})}" class="id-display text-decoration-none">
                <i class="bi bi-link-45deg"></i> <span th:text="${response.incidentId}">INC-001</span>
            </a>
        </div>

        <div class="content-card shadow-none border">
            <div class="content-card-header bg-light">
                <h6 class="content-card-title mb-0" style="font-size: 0.9rem;">
                    <i class="bi bi-cpu text-dark"></i> Profile Analysis Breakdown
                </h6>
            </div>

            <div class="accordion accordion-sentinel" id="profileAccordion">
                <div th:each="profile, iterStat : ${response.profileBreakdown}" class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                th:data-bs-target="'#collapse' + ${iterStat.index}">
                            <div class="d-flex justify-content-between w-100 align-items-center pe-3">
                                <span th:text="${profile.profileName}">Profile Name</span>
                                <span class="badge-modern"
                                      th:text="${profile.riskScore}"
                                      th:classappend="${profile.riskScore >= 80 ? 'badge-risk-high' : (profile.riskScore >= 50 ? 'badge-risk-medium' : 'badge-risk-low')}">
                                </span>
                            </div>
                        </button>
                    </h2>
                    <div th:id="'collapse' + ${iterStat.index}" class="accordion-collapse collapse" data-bs-parent="#profileAccordion">
                        <div class="accordion-body bg-white">
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <div class="analysis-label">Profile Decision</div>
                                    <span class="fw-bold" th:text="${profile.decision}">MATCH</span>
                                </div>
                                <div class="col-12">
                                    <div class="analysis-label">Rules Fired</div>
                                    <div th:if="${!#lists.isEmpty(profile.rulesFired)}">
                                        <span th:each="rule : ${profile.rulesFired}" class="rule-tag" th:text="${rule}">RULE_01</span>
                                    </div>
                                    <div th:if="${#lists.isEmpty(profile.rulesFired)}" class="text-muted small">
                                        No specific rules triggered.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${!success}" class="empty-state">
        <i class="bi bi-bug text-danger mb-3"></i>
        <h5 class="text-dark">Runtime Error</h5>
        <p class="small">The execution failed. Check if the JSON keys match the expected API schema.</p>
    </div>
</div>
