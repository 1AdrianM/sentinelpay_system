<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - SentinelPay">Dashboard</title>
    <!-- Webjars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-size: .875rem;
            margin: 0;
            padding: 0;
        }

        /* Layout principal sin conflictos */
        .layout-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar fijo */
        #sidebarMenu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            z-index: 1000;
            overflow-y: auto;
            background-color: #0f1115;
        }

        /* Contenido principal con offset para el sidebar */
        .main-wrapper {
            margin-left: 260px;
            flex: 1;
            min-height: 100vh;
        }

        /* Responsive: en mobile el sidebar se oculta */
        @media (max-width: 767.98px) {
            #sidebarMenu {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            #sidebarMenu.show {
                transform: translateX(0);
            }

            .main-wrapper {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="layout-container">
    <!-- Sidebar fijo -->
    <nav id="sidebarMenu">
        <div th:insert="~{sidebar :: sidebar}"></div>
    </nav>

    <!-- Contenido principal -->
    <div class="main-wrapper">
        <main class="px-md-4">
            <div layout:fragment="content">
                <!-- Page-specific content will be inserted here -->
            </div>
        </main>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/2.0.8/dist/htmx.min.js}"></script>
<script>
    feather.replace();

    // Toggle sidebar en mobile (opcional)
    const toggleButton = document.querySelector('.navbar-toggler');
    if (toggleButton) {
        toggleButton.addEventListener('click', function() {
            document.getElementById('sidebarMenu').classList.toggle('show');
        });
    }
</script>
</body>
</html>
