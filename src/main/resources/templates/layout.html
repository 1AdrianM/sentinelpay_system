<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - SentinelPay">Dashboard</title>
    <!-- Webjars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-size: .875rem;
            margin: 0;
            padding: 0;
        }

        /* Layout principal sin conflictos */
        .layout-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar fijo */
        #sidebarMenu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            z-index: 1000;
            overflow-y: auto;
            background-color: #0f1115;
        }

        /* Contenido principal con offset para el sidebar */
        .main-wrapper {
            margin-left: 260px;
            flex: 1;
            min-height: 100vh;
        }

        /* Responsive: en mobile el sidebar se oculta */
        @media (max-width: 767.98px) {
            #sidebarMenu {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            #sidebarMenu.show {
                transform: translateX(0);
            }

            .main-wrapper {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="layout-container">
    <!-- Sidebar fijo -->
    <nav id="sidebarMenu">
        <div th:insert="~{sidebar :: sidebar}"></div>
    </nav>

    <!-- Contenido principal -->
    <div class="main-wrapper d-flex flex-column">
        <main class="px-md-4 flex-grow-1">
            <div layout:fragment="content">
                <!-- Page-specific content will be inserted here -->
            </div>
        </main>
        
        <!-- Footer Profesional para Demo -->
        <footer class="mt-auto py-4 px-md-4 border-top bg-white">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="brand-icon" style="background: #111827; color: #10b981; width: 24px; height: 24px; font-size: 0.7rem; border-radius: 4px;">S</div>
                    <span class="text-muted small">© 2026 SentinelPay Engine. Project for Architectural Reference.</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-light text-dark border small fw-normal">
                        <i class="bi bi-code-slash me-1"></i> Clean Architecture
                    </span>
                    <span class="badge bg-light text-dark border small fw-normal">
                        <i class="bi bi-shield-check me-1"></i> Real-time Detection
                    </span>
                    <a href="https://github.com/atomic_dev25/sentinel-pay" class="text-muted text-decoration-none">
                        <i class="bi bi-github"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/2.0.8/dist/htmx.min.js}"></script>
<script>
  function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => {
                const toastHtml = '<div class="toast align-items-center text-white bg-success border-0" role="alert">' +
                    '<div class="d-flex"><div class="toast-body">' +
                    '<i class="bi bi-check-circle me-2"></i>API Key copied to clipboard!</div>' +
                    '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>' +
                    '</div></div>';

                const toastContainer = document.createElement('div');
                toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
                toastContainer.innerHTML = toastHtml;
                document.body.appendChild(toastContainer);

                const toastElement = toastContainer.querySelector('.toast');
                const toast = new bootstrap.Toast(toastElement);
                toast.show();

                toastElement.addEventListener('hidden.bs.toast', () => {
                    toastContainer.remove();
                });
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }


    feather.replace();

    // Toggle sidebar en mobile (opcional)
    const toggleButton = document.querySelector('.navbar-toggler');
    if (toggleButton) {
        toggleButton.addEventListener('click', function() {
            document.getElementById('sidebarMenu').classList.toggle('show');
        });
    }
</script>
</body>
</html>
