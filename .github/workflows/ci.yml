name: SentinelPay CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.14.3'

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelpay_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: 🔧 Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: 🏗️ Build with Gradle
      run: ./gradlew clean build -x test
      
    - name: 🧪 Run Unit Tests
      run: ./gradlew test --info
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sentinelpay_test
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test123

    - name: 📊 Generate Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: build/test-results/test/*.xml
        reporter: java-junit
        fail-on-error: false

    - name: 📈 Upload Coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        files: build/reports/jacoco/test/jacocoTestReport.xml
        fail_ci_if_error: false

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🛡️ Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'SentinelPay'
        path: '.'
        format: 'HTML'
        
    - name: 📋 Upload Security Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: reports/

  code-quality:
    name: 📏 Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: 🔍 Run Checkstyle
      run: ./gradlew checkstyleMain checkstyleTest || true

    - name: 📊 SonarQube Analysis
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./gradlew sonarqube \
          -Dsonar.projectKey=sentinelpay \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=1adrianm || echo "SonarQube skipped (no token)"

  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push'
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Log in to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          1adrianm/sentinelpay
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: 🐳 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.sentinelpay.com
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Staging
      run: |
        echo "🚧 Deployment to staging would happen here"
        echo "Platform: Render / Railway / Heroku / VPS"
        
  deploy-production:
    name: 🎯 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sentinelpay.com
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🎯 Deploy to Production
      run: |
        echo "🚀 Production deployment would happen here"
        echo "Requires manual approval or automated based on tests"

  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, code-quality]
    if: always()
    
    steps:
    - name: 📢 Send notification
      run: |
        echo "✅ CI/CD Pipeline completed"
        echo "Build: ${{ needs.build-and-test.result }}"
        echo "Security: ${{ needs.security-scan.result }}"
        echo "Quality: ${{ needs.code-quality.result }}"
